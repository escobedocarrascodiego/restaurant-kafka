# Restaurante Kafka: 1 controller KRaft + 3 brokers + Kafka UI
#
# Por que un controller aparte (y no 3 nodos "broker,controller")?
# En el experimento 7 apagamos 2 brokers. Si cada broker fuera tambien controller,
# al apagar 2 se pierde la mayoria del quorum KRaft (1 de 3) y el cluster se congela:
# el productor solo veria timeouts. Con el controller separado, el cluster sigue
# "pensando", saca a los brokers caidos del ISR y el productor recibe el error
# claro NOT_ENOUGH_REPLICAS. En produccion se usan 3 controllers (aqui 1 para ahorrar RAM).
#
# Desde tu PC:      localhost:9092, localhost:9093, localhost:9094
# Dentro de Docker: kafka-1:19092, kafka-2:19092, kafka-3:19092
# Kafka UI:         http://localhost:8080

x-kafka-comun: &kafka-comun
  image: apache/kafka:4.1.0
  depends_on:
    - controller
  environment: &kafka-env
    CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    KAFKA_PROCESS_ROLES: broker
    KAFKA_CONTROLLER_QUORUM_VOTERS: "100@controller:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092"
    KAFKA_LOG_DIRS: /tmp/kraft-logs
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

services:
  controller:
    image: apache/kafka:4.1.0
    container_name: controller
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 100
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "100@controller:9093"
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      # En KRaft es el CONTROLLER quien devuelve el liderazgo al "lider preferido" cuando un broker vuelve.
      # Revisa cada 30 s (por defecto 300 s = 5 min).
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 30
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"

  kafka-1:
    <<: *kafka-comun
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092"

  kafka-2:
    <<: *kafka-comun
    container_name: kafka-2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093"

  kafka-3:
    <<: *kafka-comun
    container_name: kafka-3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094"

  # Crea el topic "pedidos" una sola vez y termina
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists \
              --topic pedidos --partitions 3 --replication-factor 3 --config min.insync.replicas=2; do
          echo "Esperando a que los 3 brokers esten listos..."; sleep 3
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --describe --topic pedidos
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui-restaurante
    depends_on:
      - kafka-1
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: restaurante
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
