spring.application.name=pedidos-service
server.port=8090

# Los 3 brokers (basta con 1 para descubrir el resto, pero con 3 sobrevive si uno esta caido al arrancar)
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# key = id del pedido (texto), value = evento en JSON (texto)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# acks=all: el lider responde OK solo cuando todas las replicas del ISR tienen el mensaje
# (y el ISR debe tener al menos min.insync.replicas=2)
spring.kafka.producer.acks=all

# Para el experimento 7: si no hay replicas suficientes, rendirse en 15 s (por defecto son 2 minutos)
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000

# Menos ruido del cliente de Kafka, para ver claro nuestros logs (los WARN si se ven)
logging.level.org.apache.kafka=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
