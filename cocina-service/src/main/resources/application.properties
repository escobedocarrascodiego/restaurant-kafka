spring.application.name=cocina-service
server.port=8091

spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# EL DATO CLAVE: el consumer group. Kafka guarda un offset (separador) por cada group-id.
spring.kafka.consumer.group-id=cocina

# Nombre de cada instancia dentro del grupo (CLIENT-ID en kafka-consumer-groups --members): area + puerto
spring.kafka.consumer.client-id=${spring.kafka.consumer.group-id}-${server.port}

# Si este grupo NO tiene offset guardado (grupo nuevo): earliest = desde la comanda 0, latest = solo las nuevas
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Como tardamos 1 s por mensaje, pedimos pocos por vuelta (poll) para no pasarnos de max.poll.interval.ms
spring.kafka.consumer.max-poll-records=10

# Si la app muere de golpe, el grupo se da cuenta en 10 s (por defecto 45 s) y rebalancea antes
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

# Guardar (commit) el offset despues de CADA mensaje: el lag baja de 1 en 1 en Kafka UI
spring.kafka.listener.ack-mode=record

# Pausa artificial por mensaje para que el lag se note
restaurante.pausa-ms=1000

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
